name: Deploy Production

on:
  push:
    branches:
      - JacobCMS
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.PRODUCTION_HOST }}
          username: ${{ vars.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e

            cd "${{ vars.PRODUCTION_PATH }}"

            echo "==> Fetching latest JacobCMS code..."
            git fetch origin JacobCMS
            git reset --hard origin/JacobCMS

            echo "==> Building production images..."
            docker compose -f docker-compose.prod.yml build app nginx

            echo "==> Running database migrations..."
            docker compose -f docker-compose.prod.yml run --rm app php artisan migrate --force

            echo "==> Starting application..."
            docker compose -f docker-compose.prod.yml up -d app nginx queue scheduler

            echo "==> Waiting for application..."
            sleep 15

            echo "==> Container status..."
            docker compose -f docker-compose.prod.yml ps

            echo "==> Laravel health check..."
            docker compose -f docker-compose.prod.yml exec -T app php artisan about

            echo "==> HTTP health check..."
            curl -fsS http://127.0.0.1/healthz
            echo

            echo "==> Production deployment completed successfully."