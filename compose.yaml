name: softphoria

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: softphoria_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - softphoria_net
    depends_on:
      - mariadb
      - redis

  nginx:
    image: nginx:stable-alpine
    container_name: softphoria_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - softphoria_net
    depends_on:
      - app

  mariadb:
    image: mariadb:10.11.14
    container_name: softphoria_mariadb
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - softphoria_mariadb_data:/var/lib/mysql
    networks:
      - softphoria_net

  redis:
    image: redis:7-alpine
    container_name: softphoria_redis
    restart: unless-stopped
    networks:
      - softphoria_net
    # Intentionally no `ports:` — internal network access only, not exposed to host

networks:
  softphoria_net:
    name: softphoria_net
    driver: bridge

volumes:
  softphoria_mariadb_data:
    name: softphoria_mariadb_data
