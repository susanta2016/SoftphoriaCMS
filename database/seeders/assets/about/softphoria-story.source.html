<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
    @font-face { font-family: 'Inter'; src: local('Inter'), local('Segoe UI'); }
    html, body { margin: 0; width: 1600px; height: 1200px; overflow: hidden; }
    body { font-family: 'Segoe UI', 'Inter', system-ui, sans-serif; }
    svg { display: block; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#061329"/>
            <stop offset="0.55" stop-color="#0b1b36"/>
            <stop offset="1" stop-color="#0f4fc4"/>
        </linearGradient>
        <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#1661e8" stop-opacity="0.75"/>
            <stop offset="1" stop-color="#1661e8" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#5b93f5" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#5b93f5" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="orbC" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#a855f7" stop-opacity="0.35"/>
            <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
        </linearGradient>
        <linearGradient id="glassStrong" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="1" stop-color="#eaf1fd" stop-opacity="0.92"/>
        </linearGradient>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5b93f5"/>
            <stop offset="1" stop-color="#1661e8"/>
        </linearGradient>
        <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#5b93f5"/>
            <stop offset="1" stop-color="#34d399"/>
        </linearGradient>
        <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#34d399" stop-opacity="0.35"/>
            <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
        </linearGradient>
        <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.07"/>
        </pattern>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
            <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#020817" flood-opacity="0.55"/>
        </filter>
        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
            <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020817" flood-opacity="0.45"/>
        </filter>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <clipPath id="editorClip"><rect x="250" y="250" width="860" height="600" rx="28"/></clipPath>
    </defs>

    <!-- Background -->
    <rect width="1600" height="1200" fill="url(#bg)"/>
    <rect width="1600" height="1200" fill="url(#dots)"/>
    <circle cx="1280" cy="180" r="520" fill="url(#orbA)"/>
    <circle cx="220" cy="1080" r="460" fill="url(#orbB)"/>
    <circle cx="820" cy="640" r="420" fill="url(#orbC)"/>

    <!-- Orbit rings -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2">
        <ellipse cx="800" cy="600" rx="700" ry="420"/>
        <ellipse cx="800" cy="600" rx="540" ry="320" stroke-dasharray="6 14"/>
    </g>

    <!-- Code editor window (glass) -->
    <g filter="url(#shadow)">
        <rect x="250" y="250" width="860" height="600" rx="28" fill="#0b1b36" fill-opacity="0.72"/>
        <rect x="250" y="250" width="860" height="600" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    </g>
    <g clip-path="url(#editorClip)">
        <rect x="250" y="250" width="860" height="70" fill="#ffffff" fill-opacity="0.06"/>
        <rect x="250" y="320" width="190" height="530" fill="#ffffff" fill-opacity="0.035"/>
    </g>
    <circle cx="292" cy="285" r="9" fill="#ff5f57"/>
    <circle cx="322" cy="285" r="9" fill="#febc2e"/>
    <circle cx="352" cy="285" r="9" fill="#28c840"/>
    <rect x="560" y="272" width="240" height="26" rx="13" fill="#ffffff" fill-opacity="0.1"/>

    <!-- file tree -->
    <g fill="#ffffff">
        <rect x="280" y="360" width="120" height="12" rx="6" fill-opacity="0.35"/>
        <rect x="300" y="392" width="100" height="10" rx="5" fill-opacity="0.18"/>
        <rect x="300" y="420" width="84" height="10" rx="5" fill="#5b93f5" fill-opacity="0.85"/>
        <rect x="300" y="448" width="110" height="10" rx="5" fill-opacity="0.18"/>
        <rect x="280" y="488" width="96" height="12" rx="6" fill-opacity="0.35"/>
        <rect x="300" y="520" width="90" height="10" rx="5" fill-opacity="0.18"/>
        <rect x="300" y="548" width="70" height="10" rx="5" fill-opacity="0.18"/>
        <rect x="280" y="588" width="110" height="12" rx="6" fill-opacity="0.35"/>
        <rect x="300" y="620" width="96" height="10" rx="5" fill-opacity="0.18"/>
    </g>

    <!-- code lines -->
    <g>
        <g fill="#ffffff" fill-opacity="0.22">
            <rect x="470" y="364" width="22" height="10" rx="5"/><rect x="470" y="400" width="22" height="10" rx="5"/>
            <rect x="470" y="436" width="22" height="10" rx="5"/><rect x="470" y="472" width="22" height="10" rx="5"/>
            <rect x="470" y="508" width="22" height="10" rx="5"/><rect x="470" y="544" width="22" height="10" rx="5"/>
            <rect x="470" y="580" width="22" height="10" rx="5"/><rect x="470" y="616" width="22" height="10" rx="5"/>
            <rect x="470" y="652" width="22" height="10" rx="5"/><rect x="470" y="688" width="22" height="10" rx="5"/>
            <rect x="470" y="724" width="22" height="10" rx="5"/><rect x="470" y="760" width="22" height="10" rx="5"/>
        </g>
        <rect x="520" y="362" width="90" height="14" rx="7" fill="#c084fc"/>
        <rect x="620" y="362" width="170" height="14" rx="7" fill="#5b93f5"/>
        <rect x="800" y="362" width="60" height="14" rx="7" fill="#ffffff" fill-opacity="0.35"/>

        <rect x="550" y="398" width="120" height="14" rx="7" fill="#34d399"/>
        <rect x="680" y="398" width="200" height="14" rx="7" fill="#ffffff" fill-opacity="0.3"/>

        <rect x="550" y="434" width="70" height="14" rx="7" fill="#c084fc"/>
        <rect x="630" y="434" width="150" height="14" rx="7" fill="#fbbf24"/>
        <rect x="790" y="434" width="110" height="14" rx="7" fill="#ffffff" fill-opacity="0.3"/>

        <rect x="580" y="470" width="180" height="14" rx="7" fill="#5b93f5"/>
        <rect x="770" y="470" width="90" height="14" rx="7" fill="#34d399"/>

        <rect x="580" y="506" width="110" height="14" rx="7" fill="#ffffff" fill-opacity="0.3"/>
        <rect x="700" y="506" width="210" height="14" rx="7" fill="#fbbf24" fill-opacity="0.9"/>

        <rect x="550" y="542" width="60" height="14" rx="7" fill="#c084fc"/>

        <rect x="520" y="578" width="90" height="14" rx="7" fill="#c084fc"/>
        <rect x="620" y="578" width="130" height="14" rx="7" fill="#5b93f5"/>

        <rect x="550" y="614" width="160" height="14" rx="7" fill="#34d399"/>
        <rect x="720" y="614" width="150" height="14" rx="7" fill="#ffffff" fill-opacity="0.3"/>

        <rect x="550" y="650" width="100" height="14" rx="7" fill="#fbbf24"/>
        <rect x="660" y="650" width="180" height="14" rx="7" fill="#5b93f5"/>

        <rect x="580" y="686" width="220" height="14" rx="7" fill="#ffffff" fill-opacity="0.3"/>
        <rect x="550" y="722" width="60" height="14" rx="7" fill="#c084fc"/>
        <rect x="520" y="758" width="40" height="14" rx="7" fill="#ffffff" fill-opacity="0.35"/>
        <!-- cursor -->
        <rect x="570" y="754" width="4" height="22" rx="2" fill="#5b93f5" filter="url(#glow)"/>
    </g>

    <!-- Growth chart card (top-right, light) -->
    <g filter="url(#softShadow)">
        <rect x="1000" y="150" width="420" height="270" rx="26" fill="url(#glassStrong)"/>
    </g>
    <text x="1036" y="204" font-size="22" font-weight="600" fill="#0b1b36" fill-opacity="0.6">Leads &amp; growth</text>
    <text x="1036" y="250" font-size="34" font-weight="800" fill="#0b1b36">Trending up</text>
    <rect x="1276" y="224" width="110" height="34" rx="17" fill="#d1fae5"/>
    <text x="1331" y="247" font-size="18" font-weight="700" fill="#047857" text-anchor="middle">▲ live</text>
    <path d="M1036 380 L1100 360 L1160 368 L1220 330 L1280 338 L1340 296 L1386 282 L1386 396 L1036 396 Z" fill="url(#area)"/>
    <path d="M1036 380 L1100 360 L1160 368 L1220 330 L1280 338 L1340 296 L1386 282" fill="none" stroke="url(#line)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1386" cy="282" r="9" fill="#34d399" stroke="#ffffff" stroke-width="4"/>

    <!-- Performance card (bottom-right, glass) -->
    <g filter="url(#softShadow)">
        <rect x="1030" y="700" width="330" height="200" rx="26" fill="#0b1b36" fill-opacity="0.78"/>
        <rect x="1030" y="700" width="330" height="200" rx="26" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    </g>
    <g transform="translate(1110 800)">
        <circle r="54" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="12"/>
        <circle r="54" fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-dasharray="332 339" transform="rotate(-90)"/>
        <path d="M-20 2 L-6 16 L22 -14" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1190" y="786" font-size="22" font-weight="700" fill="#ffffff">Optimised</text>
    <text x="1190" y="818" font-size="18" fill="#ffffff" fill-opacity="0.6">Fast, accessible</text>
    <text x="1190" y="842" font-size="18" fill="#ffffff" fill-opacity="0.6">and SEO-ready</text>

    <!-- AI node network (bottom-left) -->
    <g filter="url(#softShadow)">
        <rect x="120" y="760" width="300" height="230" rx="26" fill="url(#glassStrong)"/>
    </g>
    <g stroke="#1661e8" stroke-opacity="0.35" stroke-width="3">
        <line x1="180" y1="850" x2="270" y2="820"/><line x1="180" y1="850" x2="270" y2="900"/>
        <line x1="270" y1="820" x2="360" y2="860"/><line x1="270" y1="900" x2="360" y2="860"/>
        <line x1="270" y1="820" x2="270" y2="900"/>
    </g>
    <circle cx="180" cy="850" r="16" fill="#5b93f5"/>
    <circle cx="270" cy="820" r="16" fill="#1661e8"/>
    <circle cx="270" cy="900" r="16" fill="#a855f7"/>
    <circle cx="360" cy="860" r="22" fill="url(#accent)" filter="url(#glow)"/>
    <path d="M360 846 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#ffffff"/>
    <text x="150" y="952" font-size="22" font-weight="700" fill="#0b1b36">AI automation</text>
    <text x="150" y="976" font-size="16" fill="#0b1b36" fill-opacity="0.55">Smarter workflows</text>

    <!-- Cloud badge (top-left) -->
    <g filter="url(#softShadow)">
        <rect x="140" y="140" width="250" height="110" rx="24" fill="#0b1b36" fill-opacity="0.8"/>
        <rect x="140" y="140" width="250" height="110" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    </g>
    <rect x="164" y="164" width="62" height="62" rx="18" fill="url(#accent)"/>
    <path d="M181 205h28a10 10 0 0 0 0-20 14 14 0 0 0-27-3 9 9 0 0 0-1 23z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    <text x="242" y="192" font-size="20" font-weight="700" fill="#ffffff">Cloud ready</text>
    <text x="242" y="220" font-size="16" fill="#ffffff" fill-opacity="0.6">Scalable &amp; secure</text>

    <!-- sparkles -->
    <g fill="#ffffff" filter="url(#glow)">
        <path d="M930 140 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" fill-opacity="0.9"/>
        <path d="M1480 560 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z" fill-opacity="0.7"/>
        <path d="M560 1000 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill-opacity="0.6"/>
    </g>
    <g fill="#ffffff">
        <circle cx="700" cy="1010" r="4" fill-opacity="0.4"/><circle cx="1480" cy="980" r="5" fill-opacity="0.35"/>
        <circle cx="110" cy="560" r="4" fill-opacity="0.35"/><circle cx="1500" cy="330" r="3" fill-opacity="0.4"/>
    </g>
</svg>
</body>
</html>
