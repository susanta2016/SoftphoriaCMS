server {
    listen 80;
    server_name allthethingslight.com www.allthethingslight.com;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name allthethingslight.com www.allthethingslight.com;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 520M;
    client_body_timeout 130s;
    send_timeout 130s;

    ssl_certificate /etc/letsencrypt/live/allthethingslight.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allthethingslight.com/privkey.pem;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 130s;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
    }

    # Temporary Beta Access Gate (App\Http\Middleware\BetaAccessGate's own
    # docblock): a file under /storage/... (public/storage is a symlink to
    # the storage disk) is served directly by this location, never reaching
    # PHP-FPM/Laravel at all — so the Laravel middleware alone cannot gate
    # it. `^~` makes this take priority over the extension-based location
    # above regardless of file extension, and auth_request asks Laravel's
    # own beta-access session check before Nginx serves anything here.
    #
    # This location is always present — enabling/disabling the gate or
    # changing the password is purely a BETA_ACCESS_ENABLED/
    # BETA_ACCESS_PASSWORD env change on the app container, never an Nginx
    # config edit or reload: when the gate is disabled, /internal/
    # beta-auth-check always returns 204 and every request here passes
    # straight through exactly as before this feature existed.
    location ^~ /storage/ {
        auth_request /internal/beta-auth-check;

        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Internal-only subrequest target for the auth_request above —
    # `internal;` means Nginx itself refuses any direct external request to
    # this URI (404), so it can only ever be reached the way it's meant to
    # be: as an auth_request subrequest, which Nginx makes as a bodyless GET
    # while still forwarding the original request's cookies — exactly what
    # BetaAccessController::authCheck() needs to read the visitor's session.
    # REQUEST_URI/SCRIPT_NAME are hardcoded rather than taken from
    # $request_uri (which inside an auth_request subrequest still reflects
    # the *original* request, not this one) so Laravel's router always
    # dispatches this exact route regardless of what the visitor originally
    # requested.
    location = /internal/beta-auth-check {
        internal;

        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /internal/beta-auth-check;
        fastcgi_param QUERY_STRING "";
        fastcgi_pass_request_body off;
        fastcgi_param CONTENT_LENGTH "";
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
    location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
    }
}
